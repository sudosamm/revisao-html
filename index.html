<!DOCTYPE html>
<html lang="pt-br"> <!-- O atributo "lang" especifica a língua principal do site -->
    <head>
        <meta charset="UTF-8"> <!-- Possibilita o uso de caracteres especiais como acentos e pontuações da língua portuguesa -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Revisão</title> <!-- Representa o título da página no navegador -->
    </head>
    <body> <!-- Esta área é responsável por exibir o conteúdo principal do site -->
        <header> <!-- área do cabeçalho do site, onde ficarão informações importantes e acessos rápidos-->
            <nav> <!-- área para navegação do site, onde o acesso rápido das páginas importantes é o diferencial -->

            </nav>
        </header>
        <main> <!-- área de conteúdo principal do site -->
            <section> <!-- é utilizado para criar uma área específica para seções de conteúdo -->
                <article><!-- é um artigo específico para aquela seção onde ele se encontra -->

                </article>

            </section>
            <aside> <!-- área dedicada para conteúdo adicional sobre o site, seção ou página atual -->

            </aside>
            <h1>Inicio da Revisão</h1> <!-- Utilizado para título principal / pode ficar menor de acordo com a prioridade -->
            <strong>Texto 1</strong> <!-- Utilizado para texto importante e aplicar negrito -->
            <br> <!-- Quebra de linha (break row) -->
            <hr> <!-- Linha Horizontal (horizontal line) -->
            <em>Texto 2</em> <!-- Utilizado para dar ênfase e aplicar itálico no texto -->
            <br>
            <img src="imagens/bg_texture.jpg" alt="Plano de fundo de deadlock" width="200px" height="300px">
            <!-- "src" indica o endereço da imagem, "alt" é a descrição alternativa para aquela imagem, "width" é a largura e "height" é a altura -->

            <form action=""> <!-- Tag utilizada para criar formulários e o atributo "action" armazena o que será executado após o envio do formulário -->
                <label for="email">email</label> <!-- Label é utilizado para identificar o a caixa de entrada de dados ao qual ele pertence -->
                <input type="email" id="email" name="email" required> <!-- é a caixa de entrada de dados com tipo definido. "id" e "name" são utilizados para identifiação dos dados e do input. "required" torna aquele campo obrigatório -->
                <label for="password">senha</label>
                <input type="password" id="password" name="password">
                <button type="submit">enviar</button>
            </form>
            <a href="./paginas/modos_de_jogo/blitz.html">Acessar blitz.html</a>
        </main>
        <footer> <!-- é o rodapé da página, onde ficam informações gerais sobre o site, empresa e/ou desenvolvedor -->
        
        </footer>
    </body>
</html>
